name: Coverage

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: write

jobs:
    badges:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.3.0
              with:
                  python-version: "3.14"
                  activate-environment: true

            - name: Install dependencies
              run: uv pip install -e . pytest coverage

            # A failing test still writes junit.xml and coverage data, so the badges can report it.
            - name: Run tests with coverage
              continue-on-error: true
              run: coverage run -m pytest --junitxml=junit.xml

            # pyproject.toml makes coverage follow the site2md commands the CLI tests start, and
            # each of those processes writes its own data file.
            - name: Combine coverage
              run: |
                  coverage combine
                  coverage xml

            - name: Generate badges
              run: |
                  uvx --from "genbadge[tests,coverage]==1.1.3" genbadge coverage -i coverage.xml -o docs/coverage.svg
                  uvx --from "genbadge[tests,coverage]==1.1.3" genbadge tests -i junit.xml -o docs/tests.svg

            - name: Commit badges
              if: github.ref == 'refs/heads/main'
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "chore: update coverage and test badges"
                  file_pattern: "docs/coverage.svg docs/tests.svg"
