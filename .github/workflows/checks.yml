name: Checks

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # The importlib.metadata stubs for 3.10 to 3.13 are narrower than the runtime objects
            # (PackageMetadata.get, read_text(encoding=...)), so type checking uses Python 3.14.
            - name: Set up uv
              uses: astral-sh/setup-uv@v10.3.0
              with:
                  python-version: "3.14"
                  activate-environment: true

            - name: Install dependencies
              run: uv pip install -e . ruff mypy

            - name: Ruff check
              run: ruff check

            - name: Mypy
              run: mypy src tests

    tests:
        runs-on: ${{ matrix.os }}
        # A hung test would otherwise hold the runner for the six-hour default.
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    # The oldest supported Python with the lowest declared dependency versions,
                    # so a floor in pyproject.toml that the code has outgrown fails here.
                    - os: ubuntu-latest
                      python-version: "3.10"
                      resolution: lowest-direct
                    - os: ubuntu-latest
                      python-version: "3.14"
                      resolution: highest
                    # Windows-only failures (#19, #23) shipped in releases before this job existed.
                    - os: windows-latest
                      python-version: "3.14"
                      resolution: highest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.3.0
              with:
                  python-version: ${{ matrix.python-version }}
                  activate-environment: true

            - name: Install the package
              run: uv pip install --resolution ${{ matrix.resolution }} -e .

            - name: Unittest
              run: python -m unittest discover -s tests
