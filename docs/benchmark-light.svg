<g class="row"><text x="75" y="47" text-anchor="end">site2md</text><rect x="83" y="30" width="8.3" height="12" fill="#2A78D6"/><text x="99.3" y="40">11.5 MB</text><rect x="83" y="44" width="334.8" height="12" fill="#EB6834"/><text x="425.8" y="54">870 ms</text></g>
