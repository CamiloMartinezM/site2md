<svg xmlns="http://www.w3.org/2000/svg" width="551" height="132" viewBox="0 0 551 132" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C9D1D9">
