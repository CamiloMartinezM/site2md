<svg xmlns="http://www.w3.org/2000/svg" width="611" height="214" viewBox="0 0 611 214" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C9D1D9">
<title>Install size and time each tool takes to extract the countries</title>
